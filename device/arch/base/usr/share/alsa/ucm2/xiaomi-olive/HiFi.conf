# Use case configuration for the Xiaomi Redmi 8 (olive).
#
# The stock Android mixer routes speaker playback through the PM8953 LINEOUT
# path into the AW87519 smart amplifier:
#
#   RX1 -> RX3 -> LINEOUT DAC -> LINE_OUT -> LINEOUT PA -> AW87519
#
# Headphones use the codec's HPHL/HPHR paths directly. The amplifier is
# programmed once at boot by olive-amp.service; this file only switches the
# codec between the speaker and headphone paths.

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 Digital Volume' 110"
		cset "name='RX3 Mute Switch' 0"
		cset "name='LINE_OUT' Switch"
	]

	DisableSequence [
		cset "name='LINE_OUT' ZERO"
		cset "name='RX3 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' 1"
		cset "name='HPHR' 1"
		cset "name='RX1 Digital Volume' 124"
		cset "name='RX2 Digital Volume' 124"
	]

	DisableSequence [
		cset "name='RX1 Digital Volume' 0"
		cset "name='RX2 Digital Volume' 0"
		cset "name='HPHL' 0"
		cset "name='HPHR' 0"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}
