# Redmi 8 (Arch): minimal initramfs built by mkinitcpio.
#
# The root filesystem is ext4 and the userdata loop driver is built into the
# kernel, so neither the block nor the filesystems hook is needed. The olive
# hook (etc/initcpio) brings up the USB rescue gadget, attaches the disk image
# on userdata as a loop device and counts boots.
#
# No autodetect: the image is built on a different machine than it boots on.
MODULES=(libcomposite usb_f_ncm)
BINARIES=()
FILES=()
HOOKS=(base udev modconf olive)
COMPRESSION="gzip"
COMPRESSION_OPTIONS=()
